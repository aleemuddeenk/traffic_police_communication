# ClearPath Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Brand & Security
spring.application.name=clearpath
clearpath.jwt.secret=${JWT_SECRET:ClearPathPoliceSecretKeySuperSecureAndLongEnoughForHmacSha256_2026!}
clearpath.jwt.expiration-ms=86400000

# Default Database: Fast In-Memory Database with PostgreSQL Compatibility for Instant Startup
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:clearpath;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at /h2-console if needed for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON Date & Geometry formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resource Handling for PWA
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging Configuration
logging.level.com.clearpath=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
